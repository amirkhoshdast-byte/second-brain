version: "3.9"

# =============================================================
# پلتفرم هوش سازمانی — محیط توسعه محلی
# =============================================================
# Ollama عمداً اینجا نیست — روی macOS به‌صورت Native اجرا می‌شود
# تا از GPU/ANE شتاب بگیرد (Docker روی Mac GPU ندارد).
#
# راه‌اندازی: docker compose up -d
# بررسی: docker compose ps
# توقف:  docker compose down
# =============================================================

x-common-env: &common-env
  TZ: Asia/Tehran

services:

  # -----------------------------------------------------------
  # Qdrant — پایگاه داده برداری (حافظه معنایی محصول A)
  # -----------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.7
    container_name: orgplatform-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      <<: *common-env
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-changeme-qdrant}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # PostgreSQL — پایگاه داده ساخت‌یافته (محصول B + Entity Registry)
  # -----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: orgplatform-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/data-model/ddl:/docker-entrypoint-initdb.d:ro
    environment:
      <<: *common-env
      POSTGRES_DB: ${POSTGRES_DB:-orgplatform}
      POSTGRES_USER: ${POSTGRES_USER:-orgplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orgplatform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # n8n — موتور Automation و Orchestration
  # -----------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: orgplatform-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      <<: *common-env
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-changeme-n8n}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      # اتصال به PostgreSQL برای ذخیره workflow‌ها (اختیاری — پیش‌فرض SQLite)
      # DB_TYPE: postgresdb
      # DB_POSTGRESDB_HOST: postgres
      # DB_POSTGRESDB_DATABASE: n8n
      # DB_POSTGRESDB_USER: ${POSTGRES_USER:-orgplatform}
      # DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres}
      # اتصال به Ollama روی host
      OLLAMA_HOST: http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # -----------------------------------------------------------
  # Redis — Cache و Queue
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: orgplatform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      <<: *common-env
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme-redis}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme-redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # Open WebUI — رابط RAG/Prototype برای تست محصول A
  # -----------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: orgplatform-open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      <<: *common-env
      # اتصال به Ollama روی host macOS (نه داخل Docker)
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-changeme-webui}
      ENABLE_SIGNUP: "false"
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

# =============================================================
# Volumes
# =============================================================
volumes:
  qdrant_data:
    driver: local
  postgres_data:
    driver: local
  n8n_data:
    driver: local
  redis_data:
    driver: local
  open_webui_data:
    driver: local
